name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ETMback-end/package-lock.json
      - run: npm ci
        working-directory: ETMback-end
      - run: npm run check
        working-directory: ETMback-end
      - run: npm test
        working-directory: ETMback-end

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ETMfront-end/package-lock.json
      - run: npm ci
        working-directory: ETMfront-end
      - run: npm test
        working-directory: ETMfront-end
      - run: npm run build
        working-directory: ETMfront-end

  infrastructure-smoke:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ETMback-end/package-lock.json
      - run: npm ci
        working-directory: ETMback-end
      - name: Start API
        run: npm start > api.log 2>&1 &
        working-directory: ETMback-end
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/etm_ci
          JWT_SECRET: ci-jwt-secret-only
          COOKIE_SECRET: ci-cookie-secret-only
          CLIENT_ORIGIN: http://localhost:5173
      - name: Check health and CSRF
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/api/health > health.json; then break; fi
            sleep 2
          done
          node -e "const fs=require('fs'); if(JSON.parse(fs.readFileSync('health.json')).status!=='ok') process.exit(1)"
          curl --fail --silent http://127.0.0.1:5000/api/csrf > csrf.json
          node -e "const fs=require('fs'); if(!JSON.parse(fs.readFileSync('csrf.json')).csrfToken) process.exit(1)"
